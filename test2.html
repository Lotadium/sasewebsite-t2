<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sac State SASE</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow-x: hidden; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

const C = {

  bg: "#0b0f0d",
  card: "#131a16",
  red: "#C8102E",
  redDim: "#8a0b20",
  green: "#2d7a4f",
  greenLight: "#3da066",
  white: "#f5f7f6",
  muted: "#7a8f85",
  border: "rgba(255,255,255,0.07)",
  borderStrong: "rgba(255,255,255,0.14)",
};

const officers = [
  { role: "President", name: "Rishi Sharma" },
  { role: "Vice President", name: "Karan Dhami" },
  { role: "Secretary", name: "Nathan Fuentabella" },
  { role: "Treasurer", name: "Tristan Ram" },
  { role: "Social Media Coordinator", name: "Jordanka Pangaben" },
  { role: "Program Manager", name: "Austin Zuniga" },
  { role: "Social Media Coordinator", name: "Darien Ho" },
  { role: "Events Coordinator", name: "Erika Hong" },
];

const events = [
  { title: "Fall Welcome Night", date: "Sep 5, 2025", location: "Riverside Hall 1020", desc: "Kick off the semester with food, games, and meeting your fellow SASE members." },
  { title: "Industry Panel Night", date: "Oct 2, 2025", location: "Amador Hall 150", desc: "Professionals from top tech companies share their career journeys and answer your questions." },
  { title: "Resume Workshop", date: "Oct 18, 2025", location: "Solano Hall 1000", desc: "Get your resume reviewed and polished before recruiting season hits." },
  { title: "Cultural Night", date: "Nov 8, 2025", location: "University Union Redwood Room", desc: "A celebration of Asian cultures through performances, food, and community." },
  { title: "Spring Networking Mixer", date: "Feb 14, 2026", location: "Amador Hall 150", desc: "Connect with industry professionals in a casual networking setting." },
  { title: "End of Year Banquet", date: "May 2, 2026", location: "University Union Ballroom", desc: "Celebrate our members' achievements and say farewell to graduating seniors." },
];

const resources = [
  { label: "SASE National", url: "https://sase.org", desc: "The official national organization website." },
  { label: "SASE National Convention", url: "https://sase.org/events/national-convention/", desc: "The largest gathering of Asian STEM professionals and students." },
  { label: "ECS Tutoring", url: "https://www.csus.edu/college/engineering-computer-science/student-success/ecs-tutoring.html", desc: "Free tutoring for Engineering and Computer Science students at Sac State." },
  { label: "ECS Scholarships", url: "https://www.csus.edu/college/engineering-computer-science/ecs-scholarships/", desc: "Scholarship opportunities for ECS students." },
  { label: "Handshake — Sac State", url: "https://csus.joinhandshake.com/", desc: "Find jobs, internships, and career events through Sac State's portal." },
];

function initials(name) {
  return name.split(" ").map((n) => n[0]).join("").slice(0, 2);
}

function Navbar({ page, setPage }) {
  const [open, setOpen] = useState(false);
  const links = ["home", "officers", "events", "resources", "join"];
  const go = (l) => {
    setPage(l);
    setOpen(false);
  };

  return (
    <nav style={{ position: "sticky", top: 0, zIndex: 100, background: C.bg, borderBottom: `1px solid ${C.border}`, padding: "0 1.25rem" }}>
      <div style={{ maxWidth: 1100, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", height: 64 }}>
        <button onClick={() => go("home")} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          <div style={{ width: 36, height: 36, borderRadius: 8, background: C.red, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <span style={{ color: "#fff", fontWeight: 800, fontSize: 14, letterSpacing: 1 }}>S</span>
          </div>
          <div style={{ textAlign: "left", minWidth: 0 }}>
            <div style={{ color: C.white, fontWeight: 700, fontSize: 15, lineHeight: 1.1, whiteSpace: "nowrap" }}>Sac State SASE</div>
            <div style={{ color: C.muted, fontSize: 11, lineHeight: 1.1, whiteSpace: "nowrap" }}>Sacramento Chapter</div>
          </div>
        </button>

        <div className="nav-desktop-links" style={{ alignItems: "center", gap: 4, flexShrink: 0 }}>
          {links.filter((l) => l !== "join").map((l) => (
            <button
              key={l}
              onClick={() => go(l)}
              style={{
                background: "none",
                border: "none",
                cursor: "pointer",
                color: page === l ? C.white : C.muted,
                fontWeight: page === l ? 600 : 400,
                fontSize: 14,
                padding: "6px 14px",
                borderRadius: 6,
                textTransform: "capitalize",
                borderBottom: page === l ? `2px solid ${C.red}` : "2px solid transparent",
                whiteSpace: "nowrap",
              }}
            >
              {l === "home" ? "Home" : l.charAt(0).toUpperCase() + l.slice(1)}
            </button>
          ))}
          <button
            onClick={() => go("join")}
            style={{ marginLeft: 8, background: C.red, border: "none", cursor: "pointer", color: "#fff", fontWeight: 600, fontSize: 14, padding: "8px 20px", borderRadius: 8, whiteSpace: "nowrap" }}
          >
            Join Us
          </button>
        </div>

        <button
          className="nav-mobile-toggle"
          onClick={() => setOpen((o) => !o)}
          aria-label="Toggle menu"
          style={{ background: "none", border: `1px solid ${C.borderStrong}`, borderRadius: 8, cursor: "pointer", width: 40, height: 40, alignItems: "center", justifyContent: "center", flexShrink: 0 }}
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke={C.white} strokeWidth="2" strokeLinecap="round">
            {open ? <path d="M6 6l12 12M18 6L6 18" /> : <path d="M4 7h16M4 12h16M4 17h16" />}
          </svg>
        </button>
      </div>

      {open && (
        <div style={{ borderTop: `1px solid ${C.border}`, padding: "8px 0 16px", display: "flex", flexDirection: "column", gap: 2 }}>
          {links.filter((l) => l !== "join").map((l) => (
            <button
              key={l}
              onClick={() => go(l)}
              style={{
                background: "none",
                border: "none",
                cursor: "pointer",
                textAlign: "left",
                color: page === l ? C.white : C.muted,
                fontWeight: page === l ? 600 : 400,
                fontSize: 15,
                padding: "12px 4px",
                textTransform: "capitalize",
                borderLeft: page === l ? `3px solid ${C.red}` : "3px solid transparent",
                paddingLeft: 14,
              }}
            >
              {l === "home" ? "Home" : l.charAt(0).toUpperCase() + l.slice(1)}
            </button>
          ))}
          <button onClick={() => go("join")} style={{ marginTop: 8, background: C.red, border: "none", cursor: "pointer", color: "#fff", fontWeight: 600, fontSize: 15, padding: "12px", borderRadius: 8, width: "100%" }}>
            Join Us
          </button>
        </div>
      )}
    </nav>
  );
}

function Home({ setPage }) {
  const pillars = [
    { title: "Mission", body: "SASE changes lives by empowering Asian students to recognize their full potential and contribute to the global STEM landscape through community, mentorship, and professional development." },
    { title: "Vision", body: "A future where Asian scientists and engineers are recognized as impactful leaders, driving innovation and creating lasting change across every field of technology and science." },
    { title: "Collaboration", body: "We build an ecosystem of cooperation between students, professionals, and industry partners — hosting workshops, networking events, and real-world learning opportunities." },
    { title: "Leadership", body: "SASE nurtures the leaders of tomorrow by connecting members with professionals who share their journeys and provide students with wisdom they can apply throughout their careers." },
  ];

  const whys = [
    "Network with industry professionals",
    "Access to exclusive scholarships",
    "Career & resume workshops",
    "Cultural community on campus",
    "Leadership development opportunities",
    "Connection to SASE National",
  ];

  return (
    <div>
      <section style={{ background: "linear-gradient(160deg, #0b0f0d 60%, #1a0810 100%)", padding: "100px 2rem 80px", textAlign: "center", position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", top: -60, left: "50%", transform: "translateX(-50%)", width: 600, height: 600, borderRadius: "50%", background: `radial-gradient(circle, ${C.redDim}22 0%, transparent 70%)`, pointerEvents: "none" }} />
        <div style={{ maxWidth: 780, margin: "0 auto", position: "relative" }}>
          <div style={{ display: "inline-block", background: `${C.green}22`, border: `1px solid ${C.green}55`, borderRadius: 20, padding: "4px 16px", marginBottom: 24 }}>
            <span style={{ color: C.greenLight, fontSize: 13, fontWeight: 600, letterSpacing: 0.5 }}>California State University, Sacramento</span>
          </div>
          <h1 style={{ color: C.white, fontSize: "clamp(2.2rem, 6vw, 3.8rem)", fontWeight: 800, lineHeight: 1.1, margin: "0 0 20px", letterSpacing: -1 }}>
            Society of Asian
            <br />
            <span style={{ color: C.red }}>Scientists & Engineers</span>
          </h1>
          <p style={{ color: C.muted, fontSize: "1.15rem", lineHeight: 1.7, maxWidth: 560, margin: "0 auto 36px" }}>
            Empowering the next generation of Asian STEM leaders through community, mentorship, and professional development at Sac State.
          </p>
          <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
            <button onClick={() => setPage("join")} style={{ background: C.red, border: "none", cursor: "pointer", color: "#fff", fontWeight: 700, fontSize: 15, padding: "14px 32px", borderRadius: 10 }}>
              Join SASE
            </button>
            <button onClick={() => setPage("events")} style={{ background: "transparent", border: `1px solid ${C.borderStrong}`, cursor: "pointer", color: C.white, fontWeight: 600, fontSize: 15, padding: "14px 32px", borderRadius: 10 }}>
              View Events
            </button>
          </div>
        </div>
      </section>

      <section style={{ padding: "80px 2rem", background: C.bg }}>
        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
          <h2 style={{ color: C.white, fontSize: "1.8rem", fontWeight: 700, marginBottom: 8, textAlign: "center" }}>Who We Are</h2>
          <p style={{ color: C.muted, textAlign: "center", marginBottom: 48, fontSize: "1rem" }}>Our chapter is built on four core principles.</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 20 }}>
            {pillars.map((p, i) => (
              <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: "28px 24px", borderTop: `3px solid ${i % 2 === 0 ? C.red : C.green}` }}>
                <h3 style={{ color: C.white, fontSize: "1.1rem", fontWeight: 700, marginBottom: 12 }}>{p.title}</h3>
                <p style={{ color: C.muted, fontSize: "0.9rem", lineHeight: 1.7, margin: 0 }}>{p.body}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section style={{ padding: "80px 2rem", background: "#0e1410" }}>
        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 36, flexWrap: "wrap", gap: 12 }}>
            <div>
              <h2 style={{ color: C.white, fontSize: "1.8rem", fontWeight: 700, margin: 0 }}>Upcoming Events</h2>
              <p style={{ color: C.muted, margin: "8px 0 0", fontSize: "0.95rem" }}>Stay connected and show up.</p>
            </div>
            <button onClick={() => setPage("events")} style={{ background: "transparent", border: `1px solid ${C.borderStrong}`, cursor: "pointer", color: C.white, fontWeight: 600, fontSize: 13, padding: "8px 20px", borderRadius: 8 }}>
              View all events →
            </button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 16 }}>
            {events.slice(0, 3).map((e, i) => (
              <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: "24px 22px" }}>
                <div style={{ color: C.red, fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 10 }}>{e.date}</div>
                <div style={{ color: C.white, fontWeight: 700, fontSize: "1.05rem", marginBottom: 8 }}>{e.title}</div>
                <div style={{ color: C.muted, fontSize: "0.85rem", marginBottom: 10 }}>📍 {e.location}</div>
                <p style={{ color: C.muted, fontSize: "0.88rem", lineHeight: 1.6, margin: 0 }}>{e.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section style={{ padding: "80px 2rem", background: C.bg }}>
        <div style={{ maxWidth: 900, margin: "0 auto", textAlign: "center" }}>
          <h2 style={{ color: C.white, fontSize: "1.8rem", fontWeight: 700, marginBottom: 8 }}>Why Join SASE?</h2>
          <p style={{ color: C.muted, marginBottom: 48, fontSize: "1rem" }}>Everything you get as a member.</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 16, textAlign: "left" }}>
            {whys.map((w, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "16px 20px" }}>
                <span style={{ color: C.green, fontSize: 10 }}>◆</span>
                <span style={{ color: C.white, fontSize: "0.95rem", fontWeight: 500 }}>{w}</span>
              </div>
            ))}
          </div>
          <button onClick={() => setPage("join")} style={{ marginTop: 40, background: C.red, border: "none", cursor: "pointer", color: "#fff", fontWeight: 700, fontSize: 15, padding: "14px 40px", borderRadius: 10 }}>
            Become a Member
          </button>
        </div>
      </section>
    </div>
  );
}

function Officers() {
  const roleColor = (role) => {
    if (role === "President") return C.red;
    if (role === "Vice President") return C.redDim;
    return C.green;
  };

  return (
    <div style={{ padding: "80px 2rem", background: C.bg, minHeight: "70vh" }}>
      <div style={{ maxWidth: 1100, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 60 }}>
          <h1 style={{ color: C.white, fontSize: "2.2rem", fontWeight: 800, margin: 0 }}>Our Officers</h1>
          <p style={{ color: C.muted, marginTop: 12, fontSize: "1rem" }}>The team leading Sac State SASE — 2025/2026.</p>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(230px, 1fr))", gap: 20 }}>
          {officers.map((o, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: "32px 24px", textAlign: "center" }}>
              <div style={{ width: 72, height: 72, borderRadius: "50%", background: `${roleColor(o.role)}22`, border: `2px solid ${roleColor(o.role)}66`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 20px" }}>
                <span style={{ color: roleColor(o.role), fontWeight: 800, fontSize: "1.2rem" }}>{initials(o.name)}</span>
              </div>
              <div style={{ color: C.white, fontWeight: 700, fontSize: "1.05rem", marginBottom: 6 }}>{o.name}</div>
              <div style={{ color: roleColor(o.role), fontSize: "0.85rem", fontWeight: 600 }}>{o.role}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Events() {
  return (
    <div style={{ padding: "80px 2rem", background: C.bg, minHeight: "70vh" }}>
      <div style={{ maxWidth: 900, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 60 }}>
          <h1 style={{ color: C.white, fontSize: "2.2rem", fontWeight: 800, margin: 0 }}>Events</h1>
          <p style={{ color: C.muted, marginTop: 12, fontSize: "1rem" }}>All SASE events for the 2025–2026 school year.</p>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          {events.map((e, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: "28px 28px", display: "flex", gap: 24, alignItems: "flex-start", flexWrap: "wrap" }}>
              <div style={{ minWidth: 100, textAlign: "center" }}>
                <div style={{ background: C.red, borderRadius: 8, padding: "6px 12px", display: "inline-block" }}>
                  <div style={{ color: "#fff", fontWeight: 800, fontSize: "0.85rem" }}>{e.date.split(",")[0]}</div>
                </div>
              </div>
              <div style={{ flex: 1, minWidth: 200 }}>
                <div style={{ color: C.white, fontWeight: 700, fontSize: "1.1rem", marginBottom: 6 }}>{e.title}</div>
                <div style={{ color: C.green, fontSize: "0.85rem", fontWeight: 600, marginBottom: 10 }}>📍 {e.location}</div>
                <p style={{ color: C.muted, fontSize: "0.9rem", lineHeight: 1.7, margin: 0 }}>{e.desc}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Resources() {
  return (
    <div style={{ padding: "80px 2rem", background: C.bg, minHeight: "70vh" }}>
      <div style={{ maxWidth: 800, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 60 }}>
          <h1 style={{ color: C.white, fontSize: "2.2rem", fontWeight: 800, margin: 0 }}>Resources</h1>
          <p style={{ color: C.muted, marginTop: 12, fontSize: "1rem" }}>Helpful links for SASE members and Sac State students.</p>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {resources.map((r, i) => (
            <a key={i} href={r.url} target="_blank" rel="noreferrer" style={{ textDecoration: "none", display: "block", background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: "22px 24px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
                <div>
                  <div style={{ color: C.white, fontWeight: 700, fontSize: "1rem", marginBottom: 4 }}>{r.label}</div>
                  <div style={{ color: C.muted, fontSize: "0.88rem" }}>{r.desc}</div>
                </div>
                <span style={{ color: C.red, fontSize: 18, flexShrink: 0 }}>→</span>
              </div>
            </a>
          ))}
        </div>
      </div>
    </div>
  );
}

function Join() {
  const [form, setForm] = useState({ name: "", email: "", major: "", year: "", reason: "" });
  const [sent, setSent] = useState(false);

  const handle = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const submit = () => {
    if (form.name && form.email) setSent(true);
  };

  const inputStyle = { width: "100%", background: C.card, border: `1px solid ${C.borderStrong}`, borderRadius: 8, padding: "12px 14px", color: C.white, fontSize: "0.95rem", outline: "none", boxSizing: "border-box" };
  const labelStyle = { color: C.muted, fontSize: "0.85rem", fontWeight: 600, display: "block", marginBottom: 6, letterSpacing: 0.3 };

  return (
    <div style={{ padding: "80px 2rem", background: C.bg, minHeight: "70vh" }}>
      <div style={{ maxWidth: 600, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 48 }}>
          <h1 style={{ color: C.white, fontSize: "2.2rem", fontWeight: 800, margin: 0 }}>Join SASE</h1>
          <p style={{ color: C.muted, marginTop: 12, fontSize: "1rem" }}>Become part of the Sac State SASE community. We meet weekly during the semester.</p>
        </div>

        {sent ? (
          <div style={{ background: `${C.green}22`, border: `1px solid ${C.green}55`, borderRadius: 14, padding: "40px 32px", textAlign: "center" }}>
            <div style={{ fontSize: 36, marginBottom: 16 }}>✓</div>
            <div style={{ color: C.white, fontWeight: 700, fontSize: "1.2rem", marginBottom: 8 }}>You're in!</div>
            <p style={{ color: C.muted, margin: 0 }}>Thanks for your interest, {form.name.split(" ")[0]}. We'll be in touch soon with details on our next meeting.</p>
          </div>
        ) : (
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, padding: "36px 32px" }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
              <div>
                <label style={labelStyle}>Full Name *</label>
                <input style={inputStyle} placeholder="Jane Doe" value={form.name} onChange={(e) => handle("name", e.target.value)} />
              </div>
              <div>
                <label style={labelStyle}>Email *</label>
                <input style={inputStyle} placeholder="you@csus.edu" value={form.email} onChange={(e) => handle("email", e.target.value)} />
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
              <div>
                <label style={labelStyle}>Major</label>
                <input style={inputStyle} placeholder="Computer Science" value={form.major} onChange={(e) => handle("major", e.target.value)} />
              </div>
              <div>
                <label style={labelStyle}>Year</label>
                <select style={{ ...inputStyle, cursor: "pointer" }} value={form.year} onChange={(e) => handle("year", e.target.value)}>
                  <option value="">Select year</option>
                  {["Freshman", "Sophomore", "Junior", "Senior", "Graduate"].map((y) => (
                    <option key={y} value={y}>
                      {y}
                    </option>
                  ))}
                </select>
              </div>
            </div>
            <div style={{ marginBottom: 24 }}>
              <label style={labelStyle}>Why do you want to join? (optional)</label>
              <textarea style={{ ...inputStyle, resize: "vertical", minHeight: 100 }} placeholder="Tell us a bit about yourself..." value={form.reason} onChange={(e) => handle("reason", e.target.value)} />
            </div>
            <button onClick={submit} style={{ width: "100%", background: C.red, border: "none", cursor: "pointer", color: "#fff", fontWeight: 700, fontSize: "1rem", padding: "14px", borderRadius: 10 }}>
              Submit
            </button>
          </div>
        )}

        <div style={{ marginTop: 40, textAlign: "center" }}>
          <p style={{ color: C.muted, fontSize: "0.9rem" }}>
            Questions? Reach us at <span style={{ color: C.white }}>sacsase@csus.edu</span>
          </p>
        </div>
      </div>
    </div>
  );
}

function Footer({ setPage }) {
  const sacLinks = [
    { label: "Home", page: "home" },
    { label: "Officers", page: "officers" },
    { label: "Events", page: "events" },
    { label: "Resources", page: "resources" },
    { label: "Join Us", page: "join" },
  ];
  const nationalLinks = [
    { label: "SASE National", url: "https://sase.org" },
    { label: "National Convention", url: "https://sase.org/events/national-convention/" },
    { label: "SASE Connect", url: "https://sase.org/connect" },
    { label: "Scholarships", url: "https://sase.org/scholarships" },
  ];

  const IconBtn = ({ href, label, path }) => (

        <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 28 }}>

}

function App() {
  const [page, setPage] = useState("home");
  const pages = { home: <Home setPage={setPage} />, officers: <Officers />, events: <Events />, resources: <Resources />, join: <Join /> };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: "system-ui, -apple-system, sans-serif" }}>
      <style>{`
        .nav-desktop-links { display: flex; }
        .nav-mobile-toggle { display: none; }
        @media (max-width: 720px) {
          .nav-desktop-links { display: none !important; }
          .nav-mobile-toggle { display: flex !important; }
        }
      `}</style>
      <Navbar page={page} setPage={setPage} />
      {pages[page]}
      <Footer setPage={setPage} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
